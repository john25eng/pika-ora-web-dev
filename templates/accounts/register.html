{% extends 'base.html' %}
{% block title %}Register - Piki Ora{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h3 class="mb-3">Create a Patient Account</h3>
            <form method="post">
                {% csrf_token %}
                <div class="row">
                    {% for field in form %}
                        <div class="col-md-6 mb-3">
                            <label class="form-label">{{ field.label }}</label>
                            {{ field }}
                            {% for error in field.errors %}
                                <div class="text-danger small">{{ error }}</div>
                            {% endfor %}
                        </div>
                    {% endfor %}
                </div>
                <button type="submit" class="btn w-100 text-white" style="background-color:#0d6e5f;">Register</button>
            </form>
            <p class="mt-3 mb-0">Already have an account? <a href="{% url 'accounts:login' %}">Log in</a></p>
        </div>
    </div>
</div>
{% endblock %}
