{% extends "base.html" %}
{% block title %}Add Booking - Piki Ora Medical Centre{% endblock %}

{% block content %}
<h1 class="h3 mb-4">Add Booking</h1>

{% if errors %}
<div class="alert alert-danger">
  <ul class="mb-0">
    {% for error in errors %}<li>{{ error }}</li>{% endfor %}
  </ul>
</div>
{% endif %}

<div class="card shadow-sm" style="max-width: 560px;">
  <div class="card-body">
<form method="post">
  {% csrf_token %}
  <div class="mb-3">
    <label class="form-label" for="patient">Patient</label>
    <select class="form-select" id="patient" name="patient" required>
      <option value="">Select...</option>
      {% for opt in patients %}
      <option value="{{ opt.id }}" {% if form.patient == opt.id %}selected{% endif %}>{{ opt.first_name }} {{ opt.last_name }} ({{ opt.email }})</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label" for="doctor">Doctor</label>
    <select class="form-select" id="doctor" name="doctor" required>
      <option value="">Select...</option>
      {% for opt in doctors %}
      <option value="{{ opt.id }}" {% if form.doctor == opt.id %}selected{% endif %}>{{ opt.full_name }} - {{ opt.specialty }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label" for="slot">Time slot</label>
    <select class="form-select" id="slot" name="slot" required>
      <option value="">Select...</option>
      {% for opt in slots %}
      <option value="{{ opt.id }}" {% if form.slot == opt.id %}selected{% endif %}>{{ opt.date }} {{ opt.start_time|time:"H:i" }} - {{ opt.end_time|time:"H:i" }}</option>
      {% endfor %}
    </select>
  </div>
  <button type="submit" class="btn btn-primary me-2">Book appointment</button>
  <a href="/admin/appointments" class="btn btn-light">Cancel</a>
</form>
  </div>
</div>
{% endblock %}
