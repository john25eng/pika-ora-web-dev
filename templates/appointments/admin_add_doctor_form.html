{% extends "base.html" %}
{% block title %}Add Doctor - Piki Ora Medical Centre{% endblock %}

{% block content %}
<h1 class="h3 mb-4">Add Doctor</h1>

{% if errors %}
<div class="alert alert-danger">
  <ul class="mb-0">
    {% for error in errors %}<li>{{ error }}</li>{% endfor %}
  </ul>
</div>
{% endif %}

<div class="card shadow-sm" style="max-width: 560px;">
  <div class="card-body">
<form method="post">
  {% csrf_token %}
  <div class="mb-3">
    <label class="form-label" for="first_name">First name</label>
    <input type="text" class="form-control" id="first_name" name="first_name" value="{{ form.first_name|default:'' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label" for="last_name">Last name</label>
    <input type="text" class="form-control" id="last_name" name="last_name" value="{{ form.last_name|default:'' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label" for="specialty">Specialty</label>
    <input type="text" class="form-control" id="specialty" name="specialty" value="{{ form.specialty|default:'' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label" for="bio">Bio</label>
    <textarea class="form-control" id="bio" name="bio" rows="3">{{ form.bio|default:'' }}</textarea>
  </div>
  <div class="form-check mb-3">
    <input type="checkbox" class="form-check-input" id="is_active" name="is_active" {% if form.is_active %}checked{% endif %}>
    <label class="form-check-label" for="is_active">Active</label>
  </div>
  <button type="submit" class="btn btn-primary me-2">Save doctor</button>
  <a href="/admin/doctors" class="btn btn-light">Cancel</a>
</form>
  </div>
</div>
{% endblock %}
