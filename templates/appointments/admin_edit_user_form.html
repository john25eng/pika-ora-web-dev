{% extends "base.html" %}
{% block title %}Edit Patient - Piki Ora Medical Centre{% endblock %}

{% block content %}
<h1 class="h3 mb-4">Edit Patient</h1>

{% if errors %}
<div class="alert alert-danger">
  <ul class="mb-0">
    {% for error in errors %}<li>{{ error }}</li>{% endfor %}
  </ul>
</div>
{% endif %}

<div class="card shadow-sm" style="max-width: 560px;">
  <div class="card-body">
<form method="post">
  {% csrf_token %}
  <div class="mb-3">
    <label class="form-label" for="first_name">First name</label>
    <input type="text" class="form-control" id="first_name" name="first_name" value="{{ form.first_name }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label" for="last_name">Last name</label>
    <input type="text" class="form-control" id="last_name" name="last_name" value="{{ form.last_name }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label" for="email">Email</label>
    <input type="email" class="form-control" id="email" name="email" value="{{ form.email }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label" for="phone_number">Phone number</label>
    <input type="text" class="form-control" id="phone_number" name="phone_number" value="{{ form.phone_number }}">
  </div>
  <div class="form-check mb-3">
    <input type="checkbox" class="form-check-input" id="is_active" name="is_active" {% if form.is_active %}checked{% endif %}>
    <label class="form-check-label" for="is_active">Active</label>
  </div>
  <button type="submit" class="btn btn-primary me-2">Save changes</button>
  <a href="/admin/patients" class="btn btn-light">Cancel</a>
</form>
  </div>
</div>
{% endblock %}
