{% extends 'base.html' %}
{% block title %}Edit Appointment{% endblock %}
{% block content %}
<h2>Edit Appointment</h2>
<p class="text-muted">{{ appointment.slot.doctor.full_name }} - {{ appointment.slot.date }} at {{ appointment.slot.start_time|time:"H:i" }}</p>
<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label">Notes</label>
        {{ form.notes }}
    </div>
    <button type="submit" class="btn text-white" style="background-color:#0d6e5f;">Save Changes</button>
    <a href="{% url 'clinic:my_appointments' %}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
