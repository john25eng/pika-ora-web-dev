{% extends 'base.html' %}
{% block title %}Delete Doctor{% endblock %}
{% block content %}
<h2>Delete Doctor</h2>
<p>Are you sure you want to remove <strong>{{ doctor.full_name }}</strong>? This will also delete all their appointment slots.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'dashboard:doctor_list' %}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
