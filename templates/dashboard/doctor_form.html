{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h2>{{ title }}</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {% for field in form %}
        <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
        </div>
    {% endfor %}
    <button type="submit" class="btn text-white" style="background-color:#0d6e5f;">Save</button>
    <a href="{% url 'dashboard:doctor_list' %}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
