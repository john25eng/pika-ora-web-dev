{% extends 'base.html' %}
{% block title %}Delete Slot{% endblock %}
{% block content %}
<h2>Delete Slot</h2>
<p>Remove the slot for <strong>{{ slot.doctor.full_name }}</strong> on {{ slot.date }} at {{ slot.start_time|time:"H:i" }}?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'dashboard:slot_list' %}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
