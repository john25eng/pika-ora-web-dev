{% extends "base.html" %}
{% block title %}Log in - Piki Ora Medical Centre{% endblock %}

{% block content %}
<h1 class="h3 mb-4">Log in</h1>

{% if errors %}
<div class="alert alert-danger">
  <ul class="mb-0">
    {% for error in errors %}<li>{{ error }}</li>{% endfor %}
  </ul>
</div>
{% endif %}

<div class="card shadow-sm" style="max-width: 560px;">
  <div class="card-body">
<form method="post">
  {% csrf_token %}
  <div class="mb-3">
    <label class="form-label" for="username">Username</label>
    <input type="text" class="form-control" id="username" name="username" value="{{ form.username.value|default:'' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label" for="password">Password</label>
    <input type="password" class="form-control" id="password" name="password" value="" required>
  </div>
  <button type="submit" class="btn btn-primary me-2">Log in</button>
  <a href="/" class="btn btn-light">Cancel</a>
</form>
  </div>
</div>

<p class="mt-3">No account yet? <a href="/register">Register here</a>.</p>
{% endblock %}
